version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupword
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - lll
    - makezero
    - misspell
    - nestif
    - nilerr
    - nilnil
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: false
      check:
        - switch
        - map
    funlen:
      lines: 90
      statements: 60
      ignore-comments: true
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
      tab-width: 4
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: indent-error-flow
        - name: range-val-in-closure
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: var-naming
    gosec:
      excludes:
        - G204
        - G304

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nunch-dev/nunch-skills
