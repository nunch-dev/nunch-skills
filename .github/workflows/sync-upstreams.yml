name: Sync upstream plugins

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test sync tool
        run: |
          pnpm run typecheck
          pnpm run test:upstream-sync
          pnpm run build

      - name: Sync configured upstreams
        run: node tools/upstream-sync/dist/upstream-sync.mjs -root .

      - name: Validate plugin manifests
        run: |
          jq -e '.name == "nunch-skills" and (.version | length > 0)' \
            plugins/nunch-skills/.codex-plugin/plugin.json >/dev/null

      - name: Create or update sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/sync-upstream-plugins
        run: |
          if git diff --quiet; then
            echo "Upstreams are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$SYNC_BRANCH"
          git add .github/upstreams.lock.json plugins/nunch-skills
          git commit -m "(upstream-sync) [chore]: 원격 스킬 동기화"
          git push --force origin "HEAD:$SYNC_BRANCH"

          body=$(cat <<'EOF'
          예약된 업스트림 동기화 결과입니다.

          - 관리 대상 경로만 원본으로 교체했습니다.
          - 번들 플러그인의 해당 스킬·스크립트만 동기화했습니다.
          - 실제 반영된 commit은 `.github/upstreams.lock.json`에 기록했습니다.

          병합되기 전에는 설치 사용자에게 배포되지 않습니다.
          EOF
          )

          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" \
              --title "(upstream-sync) [chore]: 원격 스킬 동기화" \
              --body "$body"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$SYNC_BRANCH" \
              --title "(upstream-sync) [chore]: 원격 스킬 동기화" \
              --body "$body"
          fi
